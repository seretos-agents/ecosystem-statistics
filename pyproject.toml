[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ecosystem-statistics"
version = "0.1.0"
description = "Deterministic nightly collector of Modular Software Factory ecosystem statistics."
requires-python = ">=3.11"
authors = [{ name = "Arne von Appen" }]
dependencies = [
  "httpx>=0.27",
  "pyyaml>=6",
  # Pinned to an exact tag so a clean install always resolves to the same
  # reviewed commit. A lib-python-projects release only reaches this repo via
  # an explicit, reviewed bump of this pin -- never an automatic branch move.
  # Nothing in this repo imports it yet (#16); this only adds the dependency.
  "lib-python-projects @ git+https://github.com/seretos-agents/lib-python-projects@v0.4.0",
]

[project.optional-dependencies]
test = [
  "pytest>=8",
]

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra --strict-markers"
