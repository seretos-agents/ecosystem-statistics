# Repo scope of the nightly collector. The collector reads issues, issue comments and pull
# requests for each repo via the GitHub REST API.
#
# `orgs:` names whole GitHub organisations: every repo in them (private, forks and archived
# included) is collected, including repos created after this file was written. Discovery
# lists `GET /orgs/{org}/repos` with ECOSYSTEM_TOKEN; a repo created after the run's
# `--until` day is skipped so re-running an old window stays reproducible. If a listing
# fails (403/404) the run aborts and writes no daily file.
#
# `exclude:` lists `owner/name` repos to drop from the result.
#
# `repos:` (optional) adds or overrides single repos. An entry is a bare name (needs a
# top-level `owner:`) or a mapping with `name`, optionally `owner` and/or an explicit
# `clone_url`. An explicit entry wins over a discovered repo with the same `owner/name`.
# Widening to the `Seretos/*` org is a one-line addition to `orgs:`.
orgs:
  - seretos-agents
  - seretos-games
exclude:
  - seretos-agents/ecosystem-statistics
